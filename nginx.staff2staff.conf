server {
    listen 8081;
    server_name localhost;

    # Option A: serve the Vite build directly from the project.
    # If your Windows/Nginx setup has issues with spaces in paths, use Option B
    # from DEPLOYMENT_NGINX.md and replace this root.
    root "C:/Users/ieljalili/OneDrive - Axway Software/Desktop/staff2staff-pfe/app_pilotage_frontend/dist";
    index index.html;

    # Spring Boot backend API.
    location /api/ {
        proxy_pass http://localhost:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # React Router fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache immutable Vite assets.
    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
